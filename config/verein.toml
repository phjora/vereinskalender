zugang = "oeffentlich"
sichtbarkeit = ["oeffentlich"]
mannschaften = ["U17"]
inkl_hauptverein = true
ohne_zielgruppen = ["Erwachsene"]
externe_feeds = ["https://service.bfv.de/rest/icsexport/teammatches/teamPermanentId/02TPR2ED9K000000VS5489BRVSS9M1SM"]   # BFV-Spiele U17

[[feed]]
id = "judo"
