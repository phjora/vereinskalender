# Vereinskalender – Konfiguration
# Alles Vereinsspezifische steht hier. Für einen anderen Verein reicht eine
# neue Konfiguration und eine neue Termintabelle, der Code bleibt gleich.

[verein]
name = "TSV München-Großhadern"
kurzname = "TSV Großhadern"
slug = "tsv-grosshadern"            # wird für eindeutige Termin-IDs genutzt
zeitzone = "Europe/Berlin"
farbe = "#26684C"                    # TSV-Grün aus dem Vereinslogo
# Öffentliche Basisadresse, unter der die Dateien liegen (ohne / am Ende).
# Lokal leer lassen; im GitHub-Workflow wird sie automatisch gesetzt.
basis_url = ""

# Regelmäßige Termine dieser Kategorien entfallen an gesetzlichen Feiertagen (Bayern)
# und an den zusätzlichen Tagen. Ausnahme pro Termin: Häkchen "Auch an Feiertagen" in Airtable.
[feiertage]
kategorien = ["Training"]
zusaetzlich = [
  { datum = "12-24", name = "Heiligabend" },
  { datum = "12-31", name = "Silvester" },
]

# Kombi-Kalender: mehrere Kalender in einem Link, jeder Termin nur einmal.
# Alle Kombinationen bis "max" Kalender werden vorab erzeugt.
[kombi]
max = 3
ohne = ["alle"]   # enthält ohnehin alles Öffentliche

# Farben der Abteilungen im Monatskalender (nicht aufgeführte bekommen eine Ersatzfarbe)
[abteilungsfarben]
Hauptverein = "#26684C"
"Fußball" = "#2E7DAF"
Judo = "#C8892B"
"Turnen" = "#7A5BA6"
"Aikido" = "#B5484F"
"Karate" = "#8C5A2B"
"Tischtennis" = "#1F8A8A"
"Handball" = "#C2571A"
"Basketball" = "#D0752A"
"Tennis" = "#6F7A2B"
"Fitness & Gymnastik" = "#A14A8C"

[website]
titel = "Vereinskalender"
untertitel = "Alle Termine des TSV Großhadern – einmal abonnieren, immer aktuell."
vorschau_tage = 60                   # wie weit die Terminliste auf der Website reicht

# ---------------------------------------------------------------------------
# Kalender (Feeds)
#
# sichtbarkeit   welche Sichtbarkeitsstufen der Termine enthalten sind
# zugang         "oeffentlich" = normaler Link, auf der Website gelistet
#                "intern"      = nur über persönliche geheime Links
# abteilungen / mannschaften / kategorien
#                Eingrenzung; leer = alle Termine der erlaubten Sichtbarkeit
# inkl_hauptverein
#                vereinsweite Termine (Abteilung "Hauptverein") zusätzlich aufnehmen
# ohne_kategorien  diese Kategorien ausschließen (z. B. Training)
# zielgruppen / ohne_zielgruppen  nach Zielgruppe (Jugend, Erwachsene, Alle) ein- bzw. ausschließen
# Mannschaften: id = Jahrgang-Nummer (z. B. "2018-1"). Zum Saisonwechsel nur name und
#                mannschaften hochzählen (U9 -> U10) – Abo-Links und QR-Codes bleiben gültig.
# gruppe         Überschrift, unter der der Kalender auf der Website steht
# kompakt        true = als schmale Mannschaftszeile statt als Karte
# externe_feeds  z. B. iCal-Links aus der BFV-App ("iCal Export")
# ---------------------------------------------------------------------------

[[feed]]
id = "alle"
gruppe = "Ganzer Verein"
name = "TSV Großhadern – Alle Termine"
beschreibung = "Alle öffentlichen Termine aller Abteilungen."
zugang = "oeffentlich"
sichtbarkeit = ["oeffentlich"]

[[feed]]
id = "hauptverein"
gruppe = "Ganzer Verein"
name = "TSV Großhadern – Verein"
beschreibung = "Vereinsweite Termine: Feste, Mitgliederversammlung, Aktionen."
zugang = "oeffentlich"
sichtbarkeit = ["oeffentlich"]
abteilungen = ["Hauptverein"]

[[feed]]
id = "jugend"
gruppe = "Ganzer Verein"
name = "TSV Großhadern – Jugend"
beschreibung = "Veranstaltungen für die Jugend aus allen Abteilungen – ohne Trainings und Spiele."
zugang = "oeffentlich"
sichtbarkeit = ["oeffentlich"]
zielgruppen = ["Jugend"]
ohne_zielgruppen = ["Erwachsene"]
ohne_kategorien = ["Training", "Spiel"]
inkl_hauptverein = true

[[feed]]
id = "fussball"
gruppe = "Fußball"
name = "TSV Großhadern – Fußball"
beschreibung = "Alle öffentlichen Termine der Fußballabteilung."
