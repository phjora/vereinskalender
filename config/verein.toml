# Alles mit Zielgruppe Jugend (Jugendmannschaften zählen automatisch dazu) – ohne die vielen Trainings
zielgruppen = ["Jugend"]
ohne_zielgruppen = ["Erwachsene"]
ohne_kategorien = ["Training"]
inkl_hauptverein = true

