name: Tests

# Prüft Pull Requests, bevor sie nach main kommen. Veröffentlicht nichts und braucht keine Secrets.
on:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests
        run: python -m unittest discover tests

      - name: Probe-Build mit Beispieldaten
        run: python generator/build.py
