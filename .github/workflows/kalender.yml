name: Kalender bauen und veröffentlichen

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */3 * * *"   # alle 3 Stunden (schont das Airtable-Limit von 1.000 Abrufen/Monat)
  workflow_dispatch:        # manuell starten über "Run workflow"
  issues:                   # Airtable-Automation legt ein Issue an -> sofortiger Neubau
    types: [opened]

permissions:
  contents: read
  issues: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  bauen:
    # Issues lösen den Bau nur aus, wenn sie vom Repo-Besitzer (über Airtable) kommen
    if: github.event_name != 'issues' || (github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, 'Kalender aktualisieren'))
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - id: pages
        uses: actions/configure-pages@v5

      - name: Persönliche Zugangsschlüssel in den Logs unkenntlich machen
        env:
          VK_INTERN_TOKENS: ${{ secrets.VK_INTERN_TOKENS }}
        run: |
          python - <<'PY'
          import json, os
          roh = os.environ.get("VK_INTERN_TOKENS") or "{}"
          for z in json.loads(roh).values():
              print(f"::add-mask::{z['token']}")
          PY

      - name: Tests (bei einem Fehler wird nichts veröffentlicht)
        run: python -m unittest discover tests

      - name: Kalender erzeugen
        env:
          VK_BASIS_URL: ${{ steps.pages.outputs.base_url }}
          VK_INTERN_TOKENS: ${{ secrets.VK_INTERN_TOKENS }}
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE: ${{ secrets.AIRTABLE_BASE }}
        run: python generator/build.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      # GitHub findet das eben hochgeladene Paket manchmal nicht sofort ("No artifacts named
      # github-pages"). Dann eine Minute warten und es ein zweites Mal versuchen, statt den Lauf
      # scheitern zu lassen. Erst wenn auch das fehlschlägt, gilt der Lauf als fehlgeschlagen.
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Vor dem zweiten Versuch warten
        if: steps.deploy.outcome == 'failure'
        run: sleep 60

      - id: deploy2
        name: Veröffentlichen, zweiter Versuch
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4

      - name: Auslöse-Issue schließen
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close ${{ github.event.issue.number }} --repo ${{ github.repository }}
