name: Kalender bauen und veröffentlichen

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"   # stündlich, damit BFV-Änderungen ankommen
  workflow_dispatch:        # manuell starten über "Run workflow"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  bauen:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - id: pages
        uses: actions/configure-pages@v5

      - name: Kalender erzeugen
        env:
          VK_BASIS_URL: ${{ steps.pages.outputs.base_url }}
          VK_INTERN_TOKENS: ${{ secrets.VK_INTERN_TOKENS }}
        run: python generator/build.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deploy
        uses: actions/deploy-pages@v4
