name: Kalender bauen und veröffentlichen

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */3 * * *"   # alle 3 Stunden (schont das Airtable-Limit von 1.000 Abrufen/Monat)
  workflow_dispatch:        # manuell starten über "Run workflow"
  issues:                   # Airtable-Automation legt ein Issue an -> sofortiger Neubau
    types: [opened]

permissions:
  contents: read
  issues: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  bauen:
    # Issues lösen den Bau nur aus, wenn sie vom Repo-Besitzer (über Airtable) kommen
    if: github.event_name != 'issues' || (github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, 'Kalender aktualisieren'))
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - id: pages
        uses: actions/configure-pages@v5

      - name: Kalender erzeugen
        env:
          VK_BASIS_URL: ${{ steps.pages.outputs.base_url }}
          VK_INTERN_TOKENS: ${{ secrets.VK_INTERN_TOKENS }}
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE: ${{ secrets.AIRTABLE_BASE }}
        run: python generator/build.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Auslöse-Issue schließen
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close ${{ github.event.issue.number }} --repo ${{ github.repository }}
